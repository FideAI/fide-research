name: Propose a contribution
description: Offer a specific contribution, lead work, or seek collaborators on a call.
title: "Contribution: FID-"
labels: ["type: contribution"]
body:
  - type: markdown
    attributes:
      value: |
        For questions or an initial offer to help, start in the call's [GitHub Discussion](https://github.com/FideAI/fide-research/discussions/categories/research-calls). Use this form when you have a specific contribution and first output in mind.
        Check the [open tasks](https://github.com/FideAI/fide-research/issues?q=is%3Aissue%20is%3Aopen%20label%3A%22help%20wanted%22) and comment on a matching task rather than opening a duplicate.
        Include the related FID-### IDs in the issue title so the call's related-tasks link can find your contribution.
        A claim is nonexclusive. Alex Chao (@alexchaomander) or the coordinator will help check overlaps and agree scope before substantive work. Do not post private contact details or confidential material.
  - type: input
    id: idea
    attributes:
      label: Related call IDs
      placeholder: FID-009; optionally a related call such as FID-097
    validations:
      required: true
  - type: dropdown
    id: participation
    attributes:
      label: How would you like to help?
      multiple: true
      options:
        - Lead or co-lead
        - Join a project
        - Review or offer occasional expertise
        - Find collaborators
  - type: textarea
    id: contribution
    attributes:
      label: Proposed contribution and first output
      description: What would you draft, build, review, reproduce, or analyze? A few sentences are enough.
    validations:
      required: true
  - type: input
    id: related-issue
    attributes:
      label: Related Discussion, issue, or existing work
      description: Optional. Link the call's conversation or work we should coordinate with.
  - type: input
    id: timeline
    attributes:
      label: Availability or rough timeline
  - type: textarea
    id: support
    attributes:
      label: Support or collaborators needed
      description: Use fideai.org/participate/ for private compensation or institutional constraints. Here, describe the access, review, resources, or collaborators that would help.
